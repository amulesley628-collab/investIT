services:
  - type: web
    name: investit-private-capital
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: INVESTIT_ENV
        value: production
      - key: INVESTIT_HOST
        value: 0.0.0.0
      - key: INVESTIT_HTTPS
        value: "1"
      - key: INVESTIT_PREVIEW_MODE
        value: "1"
      - key: INVESTIT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
